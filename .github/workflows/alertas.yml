# Avisos al momento.
#
# Dos relojes distintos a propósito:
#
#  · El **periódico** pasa cada diez minutos y mira qué está a punto de pasar.
#    Los avisos no se atan a la pasada: saltan en cuanto falta poco, así que
#    aunque GitHub retrase un disparo —lo hace, y bastante— el aviso llega
#    antes de tiempo, nunca después.
#
#  · El del **cierre del mercado** funciona igual: salta en cuanto quedan menos
#    de 25 minutos para las 22:00 de España, mirando la hora real del país. No
#    depende de que un disparo caiga en un minuto concreto, que es lo que hacía
#    que unos días llegara a deshora y otros no llegara.
#
# Los secretos son los mismos que el informe: SITE_URL e INFORME_TOKEN.

# ── Por qué manda una cookie ─────────────────────────────────────────────────
#
# La web entera está detrás de una contraseña (`APP_PASSWORD`) que viaja en una
# cookie llamada `access`. Un robot no tiene navegador ni cookies, así que el
# cerrojo le devolvía un 401 antes de que la ruta llegara a comprobar su
# `INFORME_TOKEN`. Aquí se le manda a mano y pasa.
#
# Hace falta un tercer secreto en el repositorio: APP_PASSWORD, con el mismo
# valor que tiene en Netlify.
#
# Cuando se despliegue la versión del middleware que deja pasar estas dos rutas
# por su token, la cookie sobrará — pero no molesta, se ignora.

name: Avisos

on:
  schedule:
    # El ciclo normal, cada diez minutos.
    - cron: "*/10 * * * *"
    # Y refuerzos en la media hora antes de que cierre el mercado (22:00 en
    # España, o sea 20:00 UTC en verano y 21:00 en invierno). El aviso salta en
    # cuanto quedan 25 minutos, así que basta con que **una** de estas pasadas
    # llegue a su hora; la memoria de lo enviado impide que llegue dos veces.
    - cron: "35,45 19,20 * * *"
  workflow_dispatch:

# Si un ciclo tarda más de la cuenta, el siguiente espera en vez de solaparse.
concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar y avisar
        run: |
          # Una sola llamada para todo. El cierre del mercado es un aviso más y
          # sale solo cuando toca, mirando la hora real de España: antes había
          # que acertar el minuto 55 en el disparo, que es justo lo que GitHub
          # no garantiza.
          respuesta=$(curl --silent --show-error --max-time 120 \
            --write-out "\n%{http_code}" \
            --cookie "access=${{ secrets.APP_PASSWORD }}" \
            "${{ secrets.SITE_URL }}/api/alertas?token=${{ secrets.INFORME_TOKEN }}")

          codigo=$(echo "$respuesta" | tail -n1)
          echo "$respuesta" | sed '$d'

          if [ "$codigo" != "200" ]; then
            echo "::error::La web respondió $codigo"
            exit 1
          fi
